<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal Login — ZentraPesa</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0f17;background-image:radial-gradient(ellipse at top,rgba(59,130,246,.08) 0%,transparent 50%);min-height:100vh;}
</style>
</head>
<body class="flex items-center justify-center px-4 py-8">
<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-blue-500/20 to-blue-600/20 border border-blue-500/30 rounded-2xl mb-3 shadow-lg shadow-blue-500/10">
            <svg class="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight" style="font-family:'Space Grotesk'">ZentraPesa Admin Portal</h1>
        <p class="text-xs text-gray-500 mt-1 flex items-center justify-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
            Restricted Operator Access
        </p>
    </div>

    <div class="bg-gray-900/80 backdrop-blur border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div id="adminAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium bg-red-500/10 border border-red-500/20 text-red-400"></div>
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 font-semibold uppercase tracking-wider mb-1.5">Admin Email / Username</label>
                <input type="text" id="adminUser" required placeholder="admin@zentrapesa.com" value="admin@zentrapesa.com" autocomplete="username"
                    class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="block text-xs text-gray-400 font-semibold uppercase tracking-wider mb-1.5">Security Password</label>
                <input type="password" id="adminPass" required placeholder="••••••••" value="Aa@22" autocomplete="current-password"
                    class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <button type="submit" id="adminLoginBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl text-sm transition-colors mt-2 flex items-center justify-center gap-2 shadow-lg shadow-blue-500/25">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                Authenticate Session
            </button>
        </form>
    </div>

    <p class="text-center text-[11px] text-gray-600 mt-6">
        <a href="../login.html" class="hover:text-gray-400 transition-colors">&larr; Back to trader login</a>
    </p>
</div>

<script>
async function handleAdminLogin(e){
  e.preventDefault();
  const alertEl = document.getElementById('adminAlert');
  alertEl.classList.add('hidden');
  
  const u = (document.getElementById('adminUser').value || '').trim();
  const p = (document.getElementById('adminPass').value || '').trim();
  const btn = document.getElementById('adminLoginBtn');

  // 1. Direct Master Verification
  const isMasterUser = (u.toLowerCase() === 'admin@zentrapesa.com' || u.toLowerCase() === 'admin');
  const isMasterPass = (p === 'Aa@22');

  if (isMasterUser && isMasterPass) {
    btn.textContent = 'Authenticating...';
    btn.disabled = true;
    localStorage.setItem('maliAdminAuth', 'true');
    localStorage.setItem('maliUser', JSON.stringify({
      id: 1,
      username: 'admin',
      email: 'admin@zentrapesa.com',
      role: 'admin',
      balance: 500000.00,
      demo_balance: 100000.00
    }));
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 250);
    return;
  }

  // 2. Neon Database Verification via API
  btn.textContent = 'Verifying with Database...';
  btn.disabled = true;

  try {
    const res = await fetch('../api/auth.js', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'login',
        identifier: u,
        password: p
      })
    });
    const data = await res.json();
    if (data.success && data.user) {
      if (data.user.role === 'admin' || isMasterUser) {
        localStorage.setItem('maliAdminAuth', 'true');
        localStorage.setItem('maliUser', JSON.stringify(data.user));
        window.location.href = 'index.html';
        return;
      } else {
        alertEl.textContent = 'Access denied: This user account does not have Admin privileges.';
        alertEl.classList.remove('hidden');
        btn.textContent = 'Authenticate Session';
        btn.disabled = false;
        return;
      }
    } else {
      alertEl.textContent = data.error || 'Invalid credentials. Default admin password is: Aa@22';
      alertEl.classList.remove('hidden');
      btn.textContent = 'Authenticate Session';
      btn.disabled = false;
      return;
    }
  } catch (err) {
    // If backend is unreachable and credentials didn't match master
    alertEl.textContent = 'Invalid credentials. Please enter the default password: Aa@22';
    alertEl.classList.remove('hidden');
    btn.textContent = 'Authenticate Session';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
