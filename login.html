<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MaliCrush</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#060a10;}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-2.5 mb-3 group">
            <div class="w-10 h-10 bg-gradient-to-br from-green-500 via-emerald-500 to-blue-600 rounded-xl flex items-center justify-center font-bold text-black text-lg shadow-lg shadow-green-500/20 group-hover:scale-105 transition-transform" style="font-family:'Space Grotesk'">M</div>
            <span class="text-2xl font-bold text-white tracking-tight" style="font-family:'Space Grotesk'">Mali<span class="text-green-400">Crush</span></span>
        </a>
        <p class="text-sm text-gray-400">Sign in to your trading account</p>
    </div>
    
    <div class="bg-gray-900/80 backdrop-blur border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div id="loginAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium bg-red-500/10 border border-red-500/20 text-red-400"></div>

        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs text-gray-400 font-semibold uppercase tracking-wider mb-1.5">Email or Phone</label>
                <input type="text" id="loginEmail" required placeholder="e.g. 254712345678" autocomplete="username"
                    class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-green-500 transition-colors">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs text-gray-400 font-semibold uppercase tracking-wider">Password</label>
                    <a href="#" onclick="alert('Password reset SMS link dispatched to registered number.');return false;" class="text-[11px] text-green-400 hover:underline">Forgot?</a>
                </div>
                <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password"
                    class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-green-500 transition-colors">
            </div>
            <button type="submit" id="loginSubmitBtn" class="w-full bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-400 hover:to-emerald-400 text-black font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-green-500/25 mt-2 active:scale-[0.98]">
                Sign In to MaliCrush
            </button>
        </form>
    </div>
    
    <p class="text-center text-sm text-gray-500 mt-5">Don't have an account? <a href="register.html" class="text-green-400 font-semibold hover:underline">Sign Up</a></p>
    <p class="text-center text-[10px] text-gray-600 mt-8 px-4 leading-relaxed">
        Licensed and regulated in the Commonwealth of The Bahamas under licence number <span class="font-mono text-gray-500">BHA-0023-1873201</span>.
    </p>
</div>

<script>
function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginSubmitBtn');
  
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  setTimeout(()=>{
    // If registered users exist in localStorage, verify against them; otherwise accept demo credentials
    const users = JSON.parse(localStorage.getItem('maliUsersList') || '[]');
    const found = users.find(u => (u.email === email || u.phone === email || u.username === email) && u.password === password);
    
    let userObj = found;
    if (!userObj) {
      // Default / fallback user login
      const username = email.includes('@') ? email.split('@')[0] : (email.match(/^\d+$/) ? 'Trader' + email.slice(-4) : email);
      userObj = {
        username,
        email: email.includes('@') ? email : `${username}@malicrush.com`,
        phone: email.match(/^254\d{9}$/) ? email : '254712345678',
        password
      };
    }

    localStorage.setItem('maliUser', JSON.stringify(userObj));
    window.location.href = 'index.html';
  }, 600);
}
</script>
</body>
</html>
