<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — VexPesa</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#060a10;}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-2.5 mb-3 group">
            <div class="w-10 h-10 bg-gradient-to-br from-green-500 via-emerald-500 to-blue-600 rounded-xl flex items-center justify-center font-bold text-black text-lg shadow-lg shadow-green-500/20 group-hover:scale-105 transition-transform" style="font-family:'Space Grotesk'">Z</div>
            <span class="text-2xl font-bold text-white tracking-tight" style="font-family:'Space Grotesk'">Vex<span class="text-green-400">Pesa</span></span>
        </a>
        <p class="text-sm text-gray-400">Sign in to your trading account</p>
    </div>
    
    <div class="bg-gray-900/80 backdrop-blur border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div id="loginAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium bg-red-500/10 border border-red-500/20 text-red-400"></div>

        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs text-gray-400 font-semibold uppercase tracking-wider mb-1.5">Email or Phone</label>
                <input type="text" id="loginEmail" required placeholder="e.g. 254712345678" autocomplete="username"
                    class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-green-500 transition-colors">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs text-gray-400 font-semibold uppercase tracking-wider">Password</label>
                    <a href="#" onclick="alert('Password reset SMS link dispatched to registered number.');return false;" class="text-[11px] text-green-400 hover:underline">Forgot?</a>
                </div>
                <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password"
                    class="w-full bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-green-500 transition-colors">
            </div>
            <button type="submit" id="loginSubmitBtn" class="w-full bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-400 hover:to-emerald-400 text-black font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-green-500/25 mt-2 active:scale-[0.98]">
                Sign In to VexPesa
            </button>
        </form>
    </div>
    
    <p class="text-center text-sm text-gray-500 mt-5">Don't have an account? <a href="register.html" class="text-green-400 font-semibold hover:underline">Sign Up</a></p>
    <p class="text-center text-[10px] text-gray-600 mt-8 px-4 leading-relaxed">
        Licensed and regulated in the Commonwealth of The Bahamas under licence number <span class="font-mono text-gray-500">BHA-0023-1873201</span>.
    </p>
</div>

<script>
async function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginSubmitBtn');
  
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    let res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'login',
        identifier: email,
        password
      })
    });
    if (!res.ok && res.status === 404) {
      res = await fetch('/api/auth.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'login',
          identifier: email,
          password
        })
      });
    }

    const data = await res.json();
    if (data.success && data.user) {
      const userObj = data.user;
      localStorage.setItem('vexpesaUser', JSON.stringify(userObj));
      localStorage.setItem('messagesAppUsername', userObj.username || userObj.phone || userObj.email || '');
      localStorage.setItem('maliUser', JSON.stringify(userObj));
      localStorage.setItem('maliRealBalance', (userObj.balance || 0).toString());
      localStorage.setItem('maliDemoBalance', (userObj.demo_balance || 10000).toString());
      if (userObj.role === 'admin' || userObj.username === 'admin') {
        localStorage.setItem('maliAdminAuth', 'true');
      }
      window.location.href = 'index.html';
      return;
    } else {
      alert(data.error || 'Invalid username/email or password.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
  } catch (err) {
    // Local fallback
    const users = JSON.parse(localStorage.getItem('maliUsersList') || '[]');
    let found = users.find(u => (u.email === email || u.phone === email || u.username === email) && u.password === password);
    
    if (!found && (email.toLowerCase() === 'admin' || email.toLowerCase() === 'admin@vexpesa.com') && password === 'Aa@22') {
      found = { id: 1, username: 'admin', email: 'admin@vexpesa.com', role: 'admin', balance: 500000, demo_balance: 100000 };
    }

    let userObj = found;
    if (!userObj) {
      alert('Invalid login credentials or user not found. Please sign up for an account.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    if (userObj.role === 'admin' || userObj.username === 'admin') {
      localStorage.setItem('maliAdminAuth', 'true');
    }
    localStorage.setItem('maliUser', JSON.stringify(userObj));
    window.location.href = 'index.html';
  }
}
</script>
</body>
</html>
